# GitHub Marketplace Categories: Utilities, Publishing
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: 'Blackout Secure Robots TXT Generator'
description: 'Generate a standards-compliant robots.txt with automated crawler rules, sitemaps, and SEO.'
author: 'Blackout Secure'
runs:
  using: 'node20'
  main: 'dist/index.js'
inputs:
  site_url:
    description: 'Base site URL (optional). Used to normalize relative sitemap_urls entries.'
    required: false
  public_dir:
    description: 'Directory to write robots.txt. Defaults to dist.'
    required: false
    default: 'dist'
  robots_output_dir:
    description: 'Override output directory for robots.txt (defaults to public_dir).'
    required: false
  robots_filename:
    description: 'Filename for robots.txt (default robots.txt).'
    required: false
    default: 'robots.txt'
  allow_autodetect:
    description: 'Auto-detect site_url/public_dir when not provided (CNAME or GitHub Pages).'
    required: false
    default: 'true'
  robots_user_agent:
    description: 'robots.txt User-agent directive (default *).'
    required: false
    default: '*'
  robots_disallow:
    description: 'Comma-separated (or newline-separated) URL-path prefixes for Disallow directives (e.g., /admin/,/private/).'
    required: false
    default: ''
  robots_allow:
    description: 'Comma-separated (or newline-separated) URL-path prefixes for Allow directives.'
    required: false
    default: ''
  robots_crawl_delay:
    description: 'Crawl-delay directive in seconds.'
    required: false
    default: ''
  robots_comments:
    description: 'Include generator comments in robots.txt.'
    required: false
    default: 'true'
  strict_validation:
    description: 'Fail the run when robots.txt validation errors are found.'
    required: false
    default: 'true'
  sitemap_urls:
    description: 'Comma-separated (or newline-separated) sitemap URLs to reference in robots.txt. Site-relative paths are resolved against site_url.'
    required: false
  include_sitemap:
    description: 'Include default sitemap URL in robots.txt (based on site_url + sitemap_filename).'
    required: false
    default: 'true'
  sitemap_filename:
    description: 'Default sitemap filename when include_sitemap is true.'
    required: false
    default: 'sitemap.xml'
  debug_show_robots:
    description: 'Debug: display generated robots.txt content.'
    required: false
    default: 'false'
  upload_artifacts:
    description: 'Upload robots.txt as a GitHub Actions artifact.'
    required: false
    default: 'true'
  artifact_name:
    description: 'Name of the artifact when upload_artifacts is enabled.'
    required: false
    default: 'robots-file'
  artifact_retention_days:
    description: 'Number of days to retain the artifact (1-90). Leave empty for default.'
    required: false
  config_path:
    description: 'Explicit repository config file. Leave empty to auto-discover `.github/bos-universal-config.json|yml`, `bos-universal-config.*`, or `.bos-robotstxt.yml` under the workspace root.'
    required: false
  global_config_path:
    description: 'Organization-level global config path, merged beneath the repository config.'
    required: false
    default: '.github/blackout-secure-robotstxt-generator-global-config.yml'
  use_global_config:
    description: 'Global config tier: auto (load when present), true (require it), or false (disable discovery).'
    required: false
    default: 'auto'
  use_marketplace_config:
    description: 'Apply the bundled marketplace baseline config as the lowest precedence tier.'
    required: false
    default: 'true'
  enable_audit:
    description: 'Run the RFC 9309 crawl-policy audit after generation. Rule severities come from `robots_txt.audit.rules` in config.'
    required: false
    default: 'true'
  audit_fail_on:
    description: 'Audit exit policy: fail (non-zero on any fail/error finding) or never. Leave empty to use `robots_txt.audit.fail_on` from config.'
    required: false
  sarif_output:
    description: 'Path to write audit findings as SARIF 2.1.0 for GitHub code scanning upload. Empty disables SARIF output.'
    required: false
  report_json:
    description: 'Path to write the machine-readable JSON audit report. Empty disables the report.'
    required: false
  redact_sensitive:
    description: 'Redact credential-shaped values from console and report surfaces. Leave empty to use redaction.enabled from config.'
    required: false
    default: ''
  redaction_placeholder:
    description: 'Replacement text for redacted values. Leave empty to use redaction.placeholder from config.'
    required: false
    default: ''
  recommendations_json:
    description: 'Path to write structured remediation recommendations for non-pass findings. Empty disables the sidecar.'
    required: false
  skips_json:
    description: 'Path to write the skipped-controls sidecar. SARIF drops `skip` findings, so this is the only machine-readable record of unassessed controls.'
    required: false
  step_summary:
    description: 'Append the Markdown audit report to $GITHUB_STEP_SUMMARY.'
    required: false
    default: 'true'
  enable_ai_summary:
    description: 'Generate a short natural-language findings summary. Falls back to a deterministic local summary when no provider is available.'
    required: false
    default: 'true'
  ai_provider:
    description: 'AI summary provider: auto (GitHub Models when a token is present), none, or a named provider backed by <NAME>_API_KEY and <NAME>_API_ENDPOINT.'
    required: false
    default: 'auto'
outputs:
  robots_path:
    description: 'Path to the generated robots.txt'
  group_count:
    description: 'Number of User-agent groups written'
  sitemap_count:
    description: 'Number of Sitemap directives written'
  config_sources:
    description: 'Comma-separated list of the applied config tiers, in precedence order'
  audit_verdict:
    description: 'Overall audit verdict: Pass, Review recommended, Action required, Inconclusive, or Not assessed'
  audit_pass_count:
    description: 'Number of audit controls that passed'
  audit_warn_count:
    description: 'Number of audit controls that produced a warning'
  audit_fail_count:
    description: 'Number of audit controls that failed'
  audit_error_count:
    description: 'Number of audit controls that could not be evaluated'
  audit_skip_count:
    description: 'Number of audit controls that were not assessed'
  sarif_path:
    description: 'Path to the written SARIF file, when sarif_output is set'
  report_json_path:
    description: 'Path to the written JSON audit report, when report_json is set'
  recommendations_json_path:
    description: 'Path to the written recommendations sidecar, when recommendations_json is set'
  ai_summary:
    description: 'Short natural-language summary of the audit findings'
branding:
  color: 'blue'
  icon: 'file-text'
